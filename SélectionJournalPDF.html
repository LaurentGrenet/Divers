<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire URL Dynamique</title>
</head>
<body>
    <form id="urlForm" onsubmit="generateURL(); return false;">
        <label for="param1">Quel journal extraire ?<br>Le Monde(LM)<br>Le Figaro(LF)<br>Telerama (TA)<br>L'Obs (OB)<br>La Tribune Dimanche (BSO)<br></label>
        <input type="text" id="param2" name="param2" required><br><br>

        <label for="param2">Pour quelle date (AAAAMMJJ)<br></label>
        <input type="text" id="param1" name="param1" required><br><br>

        <button type="submit">GO</button>
    </form>

    <script>
        function generateURL() {
            // Récupérer les valeurs des champs texte
            const param1 = document.getElementById('param1').value;
            const param2 = document.getElementById('param2').value;

            // Créer l'URL à partir du template et des paramètres saisis
            const templateURL = `https://nouveau.europresse.com/WebPages/Pdf/SearchResult.aspx?DocName=pdf%C2%B7${encodeURIComponent(param1)}%C2%B7${encodeURIComponent(param2)}_p%C2%B7`;

            // Ouvrir la nouvelle page avec l'URL générée
            window.location.href = templateURL;
        }
    </script>
</body>
</html>
