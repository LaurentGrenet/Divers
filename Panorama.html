<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur Panorama Cylindrique</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body, html { 
      width: 100%; 
      height: 100vh;
      height: 100dvh; 
      overflow: hidden; 
      background: #000; 
      font-family: sans-serif; 
    }
    
    #controls {
      position: absolute; top: 12px; left: 12px; z-index: 100;
    }
    #file-input { display: none; }
    
    .btn {
      background: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .btn:active {
      background: rgba(0, 123, 255, 0.7);
    }

    #viewport {
      width: 100vw; 
      height: 100vh;
      height: 100dvh; 
      position: relative; 
      overflow: hidden; 
      cursor: grab;
      /* Centre l'image verticalement pour éviter les décalages */
      display: flex;
      align-items: center;
    }
    #viewport:active { cursor: grabbing; }

    #strip {
      display: flex; 
      position: absolute; 
      top: 0; 
      left: 0; 
      height: 100%; 
      width: max-content;
      align-items: center;
    }
    
    /* Correction du dimensionnement strict de l'image */
    #strip img {
      max-height: 100%;
      height: auto;
      max-width: none;
      pointer-events: none; 
      user-select: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="controls">
    <button class="btn" onclick="document.getElementById('file-input').click()">📁 Changer d'image</button>
    <input type="file" id="file-input" accept="image/*">
  </div>

  <div id="viewport">
    <div id="strip">
      <img id="img1" src="" alt="">
      <img id="img2" src="" alt="">
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const img1 = document.getElementById('img1');
    const img2 = document.getElementById('img2');
    const strip = document.getElementById('strip');
    const viewport = document.getElementById('viewport');

    let posX = 0;
    let imgWidth = 0;
    let isDragging = false;
    let startX = 0;

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      img1.src = url;
      img2.src = url;
      
      img1.onload = function() {
        imgWidth = img1.getBoundingClientRect().width;
        posX = 0;
        updatePosition();
      };
    });

    function updatePosition() {
      if (imgWidth === 0) return;
      posX = ((posX % imgWidth) - imgWidth) % imgWidth;
      strip.style.transform = `translateX(${posX}px)`;
    }

    function onStart(e) {
      isDragging = true;
      startX = e.touches ? e.touches[0].clientX : e.clientX;
    }

    function onMove(e) {
      if (!isDragging || imgWidth === 0) return;
      const currentX = e.touches ? e.touches[0].clientX : e.clientX;
      const deltaX = currentX - startX;
      startX = currentX;
      posX += deltaX;
      updatePosition();
    }

    function onEnd() { isDragging = false; }

    viewport.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    viewport.addEventListener('touchstart', onStart);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onEnd);

    window.addEventListener('resize', () => {
      if (img1.src) {
        imgWidth = img1.getBoundingClientRect().width;
        updatePosition();
      }
    });
  </script>
</body>
