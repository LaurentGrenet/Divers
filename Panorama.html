<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur Panorama Cylindrique</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
    
    #controls {
      position: absolute; top: 10px; left: 10px; z-index: 100;
      background: rgba(0,0,0,0.7); color: #fff; padding: 10px; border-radius: 8px;
    }
    #file-input { display: none; }
    .btn {
      background: #007bff; color: white; padding: 8px 12px; border: none;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }

    #viewport {
      width: 100vw; height: 100vh; position: relative; overflow: hidden; cursor: grab;
    }
    #viewport:active { cursor: grabbing; }

    #strip {
      display: flex; position: absolute; top: 0; left: 0; height: 100%; width: max-content;
    }
    #strip img {
      height: 100%; width: auto; object-fit: contain; pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>

  <div id="controls">
    <button class="btn" onclick="document.getElementById('file-input').click()">Ouvrir une photo</button>
    <input type="file" id="file-input" accept="image/*">
  </div>

  <div id="viewport">
    <div id="strip">
      <img id="img1" src="" alt="">
      <img id="img2" src="" alt="">
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const img1 = document.getElementById('img1');
    const img2 = document.getElementById('img2');
    const strip = document.getElementById('strip');
    const viewport = document.getElementById('viewport');
    const controls = document.getElementById('controls');

    let posX = 0;
    let imgWidth = 0;
    let isDragging = false;
    let startX = 0;

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        img1.src = event.target.result;
        img2.src = event.target.result;
        
        img1.onload = function() {
          imgWidth = img1.clientWidth;
          posX = 0;
          updatePosition();
          controls.style.display = 'none'; // Cache le bouton une fois chargé
        };
      };
      reader.readAsDataURL(file);
    });

    function updatePosition() {
      if (imgWidth === 0) return;
      // Boucle infinie continue (Modulo)
      posX = ((posX % imgWidth) - imgWidth) % imgWidth;
      strip.style.transform = `translateX(${posX}px)`;
    }

    // Gestion du glissement (Tactile / Souris)
    function onStart(e) {
      isDragging = true;
      startX = e.touches ? e.touches[0].clientX : e.clientX;
    }

    function onMove(e) {
      if (!isDragging || imgWidth === 0) return;
      const currentX = e.touches ? e.touches[0].clientX : e.clientX;
      const deltaX = currentX - startX;
      startX = currentX;
      posX += deltaX;
      updatePosition();
    }

    function onEnd() { isDragging = false; }

    viewport.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    viewport.addEventListener('touchstart', onStart);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onEnd);

    // Ajuste si la fenêtre change de taille
    window.addEventListener('resize', () => {
      if (img1.src) {
        imgWidth = img1.clientWidth;
        updatePosition();
      }
    });
  </script>
</body>
</html>
